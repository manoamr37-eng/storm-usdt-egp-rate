name: Update public USDT EGP reference
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-p2p-price
  cancel-in-progress: false
jobs:
  quote:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Read public market price
        run: node publish-rate.mjs
      - name: Publish fresh sample
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/rate.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Refresh public USDT EGP reference'
          git push origin "HEAD:$BRANCH"
